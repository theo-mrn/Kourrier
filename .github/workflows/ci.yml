name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      # The example routes are documentation: they must stay valid.
      - run: go run ./cmd/kourrier routes check -tenants dev/tenants.yaml examples/routes.yaml
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile
      # Known vulnerabilities in the dependencies actually reachable from the
      # code, with the Go version of go.mod (the toolchain is scanned too).
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... # keep in sync with GOVULNCHECK_VERSION

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/kourrier
      - run: helm template kourrier deploy/helm/kourrier --set serviceMonitor.enabled=true --set networkPolicy.enabled=true > /dev/null
      - run: helm template kourrier deploy/helm/kourrier -f deploy/helm/kourrier/ci/events-values.yaml > /dev/null

  image:
    needs: [test, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

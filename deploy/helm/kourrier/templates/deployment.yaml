apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kourrier.fullname" . }}
  labels:
    {{- include "kourrier.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "kourrier.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if and (include "kourrier.eventsEnabled" .) (not .Values.events.existingConfigMap) }}
        checksum/routes: {{ include (print $.Template.BasePath "/routes-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kourrier.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kourrier.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: kourrier
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            {{- if include "kourrier.consoleEnabled" . }}
            - name: console
              containerPort: 8081
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "kourrier.fullname" . }}
            - secretRef:
                name: {{ include "kourrier.secretName" . }}
          env:
            # Let the Go GC work against the container memory limit instead of
            # being OOM-killed by it (bursts of events or large payloads).
            {{- if dig "limits" "memory" "" (.Values.resources | default dict) }}
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kourrier
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Every configuration file is projected into /etc/kourrier, readable
        # by the fsGroup of podSecurityContext only.
        - name: config
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ include "kourrier.secretName" . }}
                  items:
                    - key: tenants.yaml
                      path: tenants.yaml
                  {{- if not (include "kourrier.runsAPI" .) }}
                  optional: true
                  {{- end }}
              {{- if include "kourrier.consoleEnabled" . }}
              - secret:
                  name: {{ .Values.console.tokenSecret.name }}
                  items:
                    - key: {{ .Values.console.tokenSecret.key }}
                      path: console-token
              {{- end }}
              {{- if include "kourrier.eventsEnabled" . }}
              - configMap:
                  name: {{ include "kourrier.routesConfigMap" . }}
                  items:
                    - key: routes.yaml
                      path: routes.yaml
              {{- with .Values.events.nats }}
              {{- if .secretName }}
              - secret:
                  name: {{ .secretName }}
                  items:
                    {{- range (list .credsKey .nkeyKey .tls.caKey .tls.certKey .tls.keyKey) | compact | uniq }}
                    - key: {{ . }}
                      path: nats/{{ . }}
                    {{- end }}
              {{- end }}
              {{- end }}
              {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

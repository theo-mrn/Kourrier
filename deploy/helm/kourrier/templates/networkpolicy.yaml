{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kourrier.fullname" . }}
  labels:
    {{- include "kourrier.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kourrier.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if include "kourrier.runsAPI" . }}
    - ports:
        - port: http
      from:
        {{- if .Values.networkPolicy.apiFrom }}
        {{- toYaml .Values.networkPolicy.apiFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
    {{- end }}
    {{- if include "kourrier.consoleEnabled" . }}
    - ports:
        - port: console
      from:
        {{- if .Values.networkPolicy.consoleFrom }}
        {{- toYaml .Values.networkPolicy.consoleFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
    {{- end }}
    - ports:
        - port: metrics
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

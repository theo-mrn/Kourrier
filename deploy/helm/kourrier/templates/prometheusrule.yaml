{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kourrier.fullname" . }}
  labels:
    {{- include "kourrier.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kourrier
      rules:
        - alert: KourrierHighFailureRate
          expr: |
            sum by (namespace, tenant) (rate(kourrier_emails_failed_total[10m]))
              /
            (sum by (namespace, tenant) (rate(kourrier_emails_sent_total[10m])) + sum by (namespace, tenant) (rate(kourrier_emails_failed_total[10m])))
              > {{ .Values.prometheusRule.failureRatioThreshold }}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: More than {{ mulf .Values.prometheusRule.failureRatioThreshold 100 }}% of e-mails fail for tenant {{ "{{" }} $labels.tenant {{ "}}" }}
            description: Inspect the dead-letter queue with `kourrier dlq list` and the error logs in Loki.
        - alert: KourrierDeadLetters
          expr: sum by (namespace, tenant, reason) (increase(kourrier_emails_failed_total[30m])) > 0
          labels:
            severity: warning
          annotations:
            summary: E-mails of tenant {{ "{{" }} $labels.tenant {{ "}}" }} were moved to the dead-letter queue ({{ "{{" }} $labels.reason {{ "}}" }})
        - alert: KourrierQueueBacklog
          expr: max by (namespace) (kourrier_queue_depth{state="ready"}) > {{ .Values.prometheusRule.backlogThreshold }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $value {{ "}}" }} e-mails are waiting to be sent"
            description: Workers cannot keep up. Check the rate limit, the worker concurrency and the provider latency.
        - alert: KourrierHighRetryRate
          expr: sum by (namespace, provider) (rate(kourrier_job_retries_total[10m])) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The {{ "{{" }} $labels.provider {{ "}}" }} provider keeps returning transient errors
        {{- if include "kourrier.eventsEnabled" . }}
        - alert: KourrierEventsRejected
          expr: sum by (namespace, source) (rate(kourrier_events_received_total{outcome="rejected"}[10m])) > {{ .Values.prometheusRule.eventRejectionRateThreshold }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Events from {{ "{{" }} $labels.source {{ "}}" }} are rejected
            description: Producers send invalid events or a route cannot be evaluated. The reason is logged ("event rejected"); NATS also publishes MSG_TERMINATED advisories.
        - alert: KourrierDeadEvents
          expr: max by (namespace) (kourrier_dead_events) > {{ .Values.prometheusRule.deadEventsThreshold }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $value {{ "}}" }} events wait in the event dead-letter queue"
            description: Inspect them with `kourrier events list`, fix the route, the template or the producer, then `kourrier events replay`.
        - alert: KourrierEventSourceDown
          expr: max by (namespace, source) (kourrier_event_source_up) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Kourrier is not consuming the event source {{ "{{" }} $labels.source {{ "}}" }}
            description: Check the NATS connection, the stream and the consumer (logs "cannot start consuming").
        - alert: KourrierEventsBackpressure
          expr: max by (namespace) (kourrier_events_backpressure) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Event ingestion is paused because the e-mail queue is full
            description: E-mails are sent slower than events arrive; the backlog accumulates in the broker. Check the provider, the rate limit and the worker capacity.
        {{- end }}
{{- end }}

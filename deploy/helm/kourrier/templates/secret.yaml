{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kourrier.fullname" . }}
  labels:
    {{- include "kourrier.labels" . | nindent 4 }}
type: Opaque
stringData:
  tenants.yaml: |
    {{- toYaml .Values.tenants | nindent 4 }}
  {{- with .Values.redis.password }}
  KOURRIER_REDIS_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.mailer.smtp.password }}
  KOURRIER_MAILER_SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.s3.accessKeyId }}
  KOURRIER_STORAGE_S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.s3.secretAccessKey }}
  KOURRIER_STORAGE_S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "kourrier.fullname" . }}
  labels:
    {{- include "kourrier.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kourrier.selectorLabels" . | nindent 4 }}
  ports:
    {{- if include "kourrier.runsAPI" . }}
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- end }}
    - name: metrics
      port: {{ .Values.service.adminPort }}
      targetPort: metrics
      protocol: TCP

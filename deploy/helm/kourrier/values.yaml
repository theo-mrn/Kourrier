# -- Number of pods. Each pod runs the API and/or the workers depending on `mode`.
replicaCount: 1

image:
  repository: ghcr.io/theo-mrn/kourrier
  # -- Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- all (API + workers in the same pod, ADR 001), api or worker.
mode: all

log:
  level: info
  # -- json for Loki, text for humans.
  format: json

# -- E-mail provider (ADR 004). The default never sends anything.
mailer:
  # -- aws-ses | smtp | console | filesystem
  provider: console
  ses:
    region: eu-west-3
    # -- SES configuration set used to publish bounce/complaint events.
    configurationSet: ""
  smtp:
    host: ""
    port: 587
    # -- none | opportunistic | mandatory | implicit
    tls: mandatory
    username: ""
    # -- Prefer secrets.existingSecret with KOURRIER_MAILER_SMTP_PASSWORD.
    password: ""

# -- Template storage (ADR 003).
storage:
  # -- s3 | filesystem
  provider: s3
  s3:
    bucket: kourrier-templates
    prefix: ""
    region: us-east-1
    # -- Set for MinIO / RustFS / any S3-compatible service, e.g. http://minio.storage:9000.
    endpoint: ""
    usePathStyle: false
    # -- Static credentials, only needed outside AWS (IRSA is used otherwise).
    accessKeyId: ""
    secretAccessKey: ""

# -- Redis >= 7 (queue, idempotency keys, statuses, rate limiter).
redis:
  addr: redis-master:6379
  username: ""
  # -- Prefer secrets.existingSecret with KOURRIER_REDIS_PASSWORD.
  password: ""
  db: 0
  tls: false
  keyPrefix: kourrier
  # -- Wait for this many replicas to acknowledge every submission (Redis
  # WAIT), so a primary failover cannot lose an accepted e-mail or event. 0 disables it.
  waitReplicas: 0
  waitTimeout: 500ms

worker:
  concurrency: 8
  maxAttempts: 8
  sendTimeout: 30s
  backoffBase: 10s
  backoffMax: 30m

# -- Sending rate across the whole deployment (ADR 009). 0 disables it.
rateLimit:
  perSecond: 10
  burst: 10
  # -- global (shared through Redis) or local (per pod).
  scope: global

templates:
  cacheTTL: 1m
  defaultLocale: en

# -- Event ingress (ADR 012): CloudEvents consumed from NATS JetStream or
# pushed to POST /v1/events are turned into e-mails by declarative routes.
# Runs in the API pods (mode all or api). Disabled while no routes are set.
events:
  # -- Content of the routes file (docs/events.md), rendered into a ConfigMap.
  # Ignored when existingConfigMap is set.
  routes: {}
  #  apiVersion: kourrier/v1alpha1
  #  sources:
  #    nats:
  #      - { name: users, tenant: yner, stream: USERS, consumer: kourrier }
  #  routes:
  #    - name: welcome
  #      tenant: yner
  #      match: { types: [com.yner.user.signed_up] }
  #      email: { template: welcome, to: data.email }
  # -- Existing ConfigMap holding a `routes.yaml` key, e.g. generated by your
  # GitOps tooling from the repository that holds the templates.
  existingConfigMap: ""
  # -- Pause ingestion while more e-mails than this wait in the queue, so the
  # backlog stays in the broker rather than in Redis memory. 0 disables it.
  maxQueueDepth: 50000
  # -- Maximum size of one event in bytes (HTTP body or NATS payload).
  maxBytes: 262144
  # -- Approximate cap of the event dead-letter queue (`kourrier events list`).
  deadLetterMaxLen: 10000
  nats:
    url: nats://nats:4222
    # -- Existing Secret holding the NATS credentials files below.
    secretName: ""
    # -- Key of a credentials file (JWT + NKey seed) in secretName.
    credsKey: ""
    # -- Key of an NKey seed file in secretName (servers without JWT auth).
    nkeyKey: ""
    tls:
      # -- Key of the CA certificate in secretName.
      caKey: ""
      # -- Keys of the client certificate and private key (mutual TLS).
      certKey: ""
      keyKey: ""

# -- Web administration console (ADR 016, docs/console.md), disabled by
# default. It runs with the API (mode all or api), on its own port and its
# own Service: the public API Service and Ingress never expose it.
console:
  enabled: false
  # -- Existing Secret holding the admin token (at least 32 characters), e.g.
  # kubectl create secret generic kourrier-console --from-literal=token="$(openssl rand -base64 32)"
  tokenSecret:
    name: ""
    key: token
  sessionTTL: 12h
  # -- Secure attribute of the session cookie. Keep it: browsers accept it
  # over HTTPS and on localhost (kubectl port-forward).
  secureCookie: true
  service:
    port: 8081

# -- Feed of the latest status changes shown by the console (ADR 016).
activity:
  # -- Approximate number of entries kept in Redis. 0 disables the feed.
  maxLen: 10000

# -- Additional KOURRIER_* variables (see docs/configuration.md).
extraEnv: []
#  - name: KOURRIER_STATUS_TTL
#    value: 72h

# -- Content of tenants.yaml (ADR 008), stored in a Secret. Ignored when
# secrets.existingSecret is set. Generate keys with `kourrier keygen`.
tenants:
  tenants: []
  #  - id: yner
  #    api_keys:
  #      - sha256: <digest printed by kourrier keygen>
  #        scopes: [emails]          # emails, events; default both. Give event producers [events] only.
  #    default_sender: { email: no-reply@yner.fr, name: Yner }
  #    allowed_senders: ["no-reply@yner.fr"]

secrets:
  # -- Use an existing Secret instead of rendering one from the values above.
  # It must contain a `tenants.yaml` key and may contain KOURRIER_* keys
  # (KOURRIER_REDIS_PASSWORD, KOURRIER_MAILER_SMTP_PASSWORD,
  # KOURRIER_STORAGE_S3_ACCESS_KEY_ID, KOURRIER_STORAGE_S3_SECRET_ACCESS_KEY)
  # that are injected as environment variables.
  existingSecret: ""

serviceAccount:
  create: true
  name: ""
  # -- e.g. eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/kourrier
  annotations: {}
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi

# -- Must exceed the 25s graceful shutdown of the service.
terminationGracePeriodSeconds: 35

service:
  type: ClusterIP
  port: 8080
  adminPort: 9090

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kourrier.example.com
      paths:
        - path: /v1
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  # -- Peers allowed to call the API (port 8080). Empty allows the whole namespace.
  apiFrom: []
  # -- Peers allowed to scrape metrics (port 9090). Empty allows every namespace.
  metricsFrom: []
  # -- Peers allowed to reach the console (port 8081). Empty allows the whole namespace.
  consoleFrom: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# -- Prometheus Operator ServiceMonitor (ADR 005).
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# -- Prometheus Operator alerting rules.
prometheusRule:
  enabled: false
  labels: {}
  # -- Failure ratio (failed / (sent + failed)) above which to alert.
  failureRatioThreshold: 0.05
  # -- Ready jobs above which the backlog alert fires.
  backlogThreshold: 1000
  # -- Rejected events per second above which to alert (event ingress).
  eventRejectionRateThreshold: 0
  # -- Events in the event dead-letter queue above which to alert.
  deadEventsThreshold: 0

# -- Grafana dashboard picked up by the Grafana sidecar (ADR 005).
grafanaDashboard:
  enabled: true
  # -- Namespace of the ConfigMap; defaults to the release namespace.
  namespace: ""
  labels:
    grafana_dashboard: "1"
  annotations: {}
  #  grafana_folder: Kourrier

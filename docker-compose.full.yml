# Production-like drivers on top of docker-compose.yml: templates served by an
# S3-compatible store (RustFS) and e-mails delivered over SMTP to Mailpit.
#
#   make up-full
#
#   - RustFS console  http://localhost:9201 (kourrier / kourrier-dev-secret)
#   - Mailpit         http://localhost:8125
#
# Templates are uploaded from examples/templates by the s3-init job. After
# editing them: docker compose -f docker-compose.yml -f docker-compose.full.yml run --rm s3-init
x-s3-credentials: &s3-credentials
  AWS_ACCESS_KEY_ID: kourrier
  AWS_SECRET_ACCESS_KEY: kourrier-dev-secret
  AWS_DEFAULT_REGION: us-east-1

services:
  kourrier:
    depends_on:
      s3-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    environment:
      KOURRIER_STORAGE_PROVIDER: s3
      KOURRIER_STORAGE_S3_ENDPOINT: http://s3:9000
      KOURRIER_STORAGE_S3_BUCKET: kourrier-templates
      KOURRIER_STORAGE_S3_USE_PATH_STYLE: "true"
      KOURRIER_STORAGE_S3_ACCESS_KEY_ID: kourrier
      KOURRIER_STORAGE_S3_SECRET_ACCESS_KEY: kourrier-dev-secret
      KOURRIER_TEMPLATES_CACHE_TTL: 5s
      KOURRIER_MAILER_PROVIDER: smtp
      KOURRIER_MAILER_SMTP_HOST: mailpit
      KOURRIER_MAILER_SMTP_PORT: "1025"
      KOURRIER_MAILER_SMTP_TLS: none

  # MinIO no longer publishes images (ADR 003): RustFS is S3-compatible.
  s3:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: kourrier
      RUSTFS_SECRET_KEY: kourrier-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${S3_PORT:-9200}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9201}:9001"
    volumes:
      - s3-data:/data

  s3-init:
    image: amazon/aws-cli:latest
    depends_on: [s3]
    environment: *s3-credentials
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://s3:9000 s3 ls >/dev/null 2>&1; do echo "waiting for s3..."; sleep 1; done
        aws --endpoint-url http://s3:9000 s3 mb s3://kourrier-templates 2>/dev/null || true
        aws --endpoint-url http://s3:9000 s3 sync --delete /templates s3://kourrier-templates/
    volumes:
      - ./examples/templates:/templates:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8125}:8025"

volumes:
  s3-data:

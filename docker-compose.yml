# Local development stack: Redis, NATS and Kourrier, e-mails printed by the
# console driver. Nothing leaves the machine and no AWS account is needed
# (ADR 004).
#
#   make up          # start (http://localhost:8180)
#   make send        # send the demo "welcome" e-mail through the HTTP API
#   make event       # publish the demo CloudEvent to NATS (examples/routes.yaml)
#   make logs        # read the e-mails
#
# The admin console (ADR 016) is on http://localhost:8181, with the token of
# dev/console-token.
#
# Templates are read from examples/templates on every send: edit a file and
# send again to see the result. For the production-like drivers (S3 storage and
# SMTP delivery), use `make up-full` (docker-compose.full.yml).
#
# Host ports are bound to 127.0.0.1. Their defaults avoid the usual ones (6379,
# 8080, 8025…) so the stack can run next to other projects; override them with
# the variables below if needed.
name: kourrier

services:
  kourrier:
    build: .
    depends_on:
      redis: { condition: service_healthy }
      nats-init: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:${KOURRIER_PORT:-8180}:8080"
      - "127.0.0.1:${KOURRIER_ADMIN_PORT:-9190}:9090"
      - "127.0.0.1:${KOURRIER_CONSOLE_PORT:-8181}:8081"
    environment:
      KOURRIER_LOG_FORMAT: text
      KOURRIER_LOG_LEVEL: debug
      KOURRIER_TENANTS_FILE: /etc/kourrier/tenants.yaml
      KOURRIER_REDIS_ADDR: redis:6379
      KOURRIER_STORAGE_PROVIDER: filesystem
      KOURRIER_STORAGE_DIR: /templates
      KOURRIER_TEMPLATES_CACHE_TTL: 0s
      KOURRIER_TEMPLATES_DEFAULT_LOCALE: en
      KOURRIER_RATE_LIMIT_PER_SECOND: "0"
      KOURRIER_MAILER_PROVIDER: console
      KOURRIER_EVENTS_ROUTES_FILE: /etc/kourrier/routes.yaml
      KOURRIER_EVENTS_NATS_URL: nats://nats:4222
      KOURRIER_CONSOLE_ENABLED: "true"
      KOURRIER_CONSOLE_TOKEN_FILE: /etc/kourrier/console-token
      # Plain HTTP on localhost only.
      KOURRIER_CONSOLE_SECURE_COOKIE: "false"
    volumes:
      - ./dev/tenants.yaml:/etc/kourrier/tenants.yaml:ro
      - ./examples/routes.yaml:/etc/kourrier/routes.yaml:ro
      - ./dev/console-token:/etc/kourrier/console-token:ro
      - ./examples/templates:/templates:ro

  # Also used on its own by `make run`, which runs Kourrier from source.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6390}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  nats:
    image: nats:2.12-alpine
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4322}:4222"
    volumes:
      - nats-data:/data

  # Creates the USERS stream consumed by the demo routes. In production the
  # stream belongs to the producers or the platform team: Kourrier never
  # creates streams. `make event` reuses this container to publish an event.
  nats-init:
    image: natsio/nats-box:latest
    depends_on: [nats]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until nats --server nats://nats:4222 account info >/dev/null 2>&1; do echo "waiting for nats..."; sleep 1; done
        nats --server nats://nats:4222 stream info USERS >/dev/null 2>&1 ||
          nats --server nats://nats:4222 stream add USERS --subjects 'users.>' --storage file --max-age 168h --defaults
    volumes:
      - ./examples/events:/events:ro

volumes:
  redis-data:
  nats-data:
